name: Backend CI

on:
  push:
    branches: ["main", "chore/**", "refactor/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: node --check frontend/script.js

  build:
    name: Build and test backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: sh ./mvnw -B verify

  container-build:
    name: Build backend container and verify non-root user
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag disaster-emergency-alert-backend:ci backend

      - name: Verify configured runtime user
        run: |
          image_user="$(docker image inspect disaster-emergency-alert-backend:ci --format '{{.Config.User}}')"
          test "$image_user" = "10001:10001"
